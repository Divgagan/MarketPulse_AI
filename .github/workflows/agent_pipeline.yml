name: MarketPulse AI Pipeline

on:
  schedule:
    # ML Pipeline: 8:15 AM IST = 2:45 AM UTC, Mon-Fri
    # Runs exactly 1 hour before market opens at 9:15 AM IST.
    - cron: '45 2 * * 1-5'

    # News Pipeline: Every 30 mins from 6:30 AM to 6:00 PM IST
    # = 1:00 AM to 12:30 PM UTC, Mon-Fri
    # Catches pre-market news, intraday developments, and post-market announcements.
    - cron: '*/30 1-12 * * 1-5'

    # Monthly Retraining + Drift Check: 1st of every month at 2:30 PM UTC (= 8 PM IST)
    - cron: '30 14 1 * *'

  workflow_dispatch:
    inputs:
      run_type:
        description: 'What to run'
        required: false
        default: 'eod'
        type: choice
        options:
          - eod
          - news
          - retrain
          - both

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_pipeline.txt
        python -m spacy download en_core_web_sm

    # ── ML Pipeline: 8:15 AM IST = 2:45 AM UTC, Mon-Fri ───────────────────
    # Runs exactly 1 hour before market opens (9:15 AM IST).
    - name: Run ML Pipeline (1hr Pre-Market Predictions)
      if: |
        github.event_name == 'workflow_dispatch' && (github.event.inputs.run_type == 'eod' || github.event.inputs.run_type == 'both') ||
        github.event.schedule == '45 2 * * 1-5'
      env:
        PYTHONPATH: "."
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: |
        echo "=== Starting ML Pipeline (Pre-Market) at $(date -u) ==="
        python -m pipeline.eod_pipeline
        echo "=== ML Pipeline Finished at $(date -u) ==="

    # ── News Pipeline: every 30 mins (6:30 AM to 6:00 PM IST) ────────────────
    - name: Run News Cycle Pipeline (Every 30 min)
      if: |
        github.event_name == 'workflow_dispatch' && (github.event.inputs.run_type == 'news' || github.event.inputs.run_type == 'both') ||
        github.event.schedule == '*/30 1-12 * * 1-5'
      env:
        PYTHONPATH: "."
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: |
        echo "=== Starting News Cycle Pipeline at $(date -u) ==="
        python -c "from agents.graph import run_pipeline; run_pipeline('news_cycle')"
        echo "=== News Cycle Pipeline Finished at $(date -u) ==="

    # ── Monthly Retraining + Drift Check: 1st of every month at 8 PM IST ───
    # Improvement #1 (MLflow) + #2 (Drift) + #4 (Optuna) all run here.
    - name: Run Monthly Drift Check
      if: |
        github.event_name == 'workflow_dispatch' && (github.event.inputs.run_type == 'retrain' || github.event.inputs.run_type == 'both') ||
        github.event.schedule == '30 14 1 * *'
      env:
        PYTHONPATH: "."
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        echo "=== Running Data Drift Check at $(date -u) ==="
        python -c "
        from ml.drift_monitor import run_weekly_drift_check
        results = run_weekly_drift_check()
        red = [t for t, r in results.items() if r.get('severity') == 'RED']
        if red:
            print(f'WARNING: HIGH DRIFT detected for: {red}')
        else:
            print('Drift check complete — no critical drift detected.')
        "
        echo "=== Drift Check Finished at $(date -u) ==="

    - name: Run Monthly Model Retraining (Optuna + MLflow)
      if: |
        github.event_name == 'workflow_dispatch' && (github.event.inputs.run_type == 'retrain' || github.event.inputs.run_type == 'both') ||
        github.event.schedule == '30 14 1 * *'
      env:
        PYTHONPATH: "."
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        echo "=== Starting Monthly Retraining (Optuna + MLflow) at $(date -u) ==="
        python -c "
        from ml.model_trainer import train_all_stocks
        # use_optuna=True: Optuna searches best params per stock (#4)
        # MLflow automatically tracks every run (#1)
        # Calibration (#3) and Meta-Learner (#5) applied inside train_final_models()
        results = train_all_stocks(skip_existing=False, use_optuna=True)
        print(f'Monthly retraining complete: {len(results)} stocks trained.')
        "
        echo "=== Monthly Retraining Finished at $(date -u) ==="
